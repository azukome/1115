<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>扭蛋抽獎機</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
<main class="gacha-wrap">
  <header class="title-area">
    <h1>扭蛋抽獎機</h1>
  </header>

  <div class="row-container">
    <div class="machine-col">
      <div class="egg-machine">
        <div class="machine-top">
          <span class="light"></span>
          <span class="light"></span>
          <span class="light"></span>
          <span class="light"></span>
          <span class="light"></span>
        </div>

        <div class="machine-body">
          <div class="spin-cage-square">
            <div class="cage-shine"></div>
            <div class="egg-inner" id="eggInner"></div>
          </div>

          <div class="egg-outlet">
            <div class="pipe-top"></div>
            <div class="fall-zone" id="fallZone"></div>
          </div>

          <button class="body-start-knob" id="startBtn">
          </button>
          <div class="body-coin-slot">
            <div class="coin-slot-hole"></div>
          </div>
          <div class="body-return-slot">
  <div class="return-slot-hole"></div>
</div>

        </div>

        <div class="machine-base"></div>
      </div>
    </div>

    <div class="form-col">
      <div class="prize-set">
        <p>獎品清單（一行一個獎品，對應1~7號扭蛋）</p>
        <textarea id="prizeTextarea"></textarea>
      </div>
      
      <div class="result-area" id="resultBox">
        <small>等待開獎</small>
        <div class="result-egg"></div>
      </div>
    </div>
  </div>

</main>

<script src="script.js"></script>
</body>
</html>
